; =====================================================================
;  evalkit settings
;
;  1. Change the values below (the text after each = sign).
;  2. Save this file.
;  3. Run start.py (double-click it, or open it in IDLE / VS Code and press Run).
;
;  Lines starting with ; are notes for you and are ignored.
;  Leave a value blank to use the default.
;  Paths use forward slashes, e.g. cases/demo_support.jsonl
; =====================================================================


[what to do]
; Choose one:
;   test and report        run the tests, then build and open the report (the normal choice)
;   report only            rebuild the report from the latest run with the name below, without re-testing.
;                          Free and instant: use it after editing your notes file.
;   export marking sheet   create a spreadsheet for checking the AI judge (README Part 5)
;   score marking sheet    compare your marks in that spreadsheet with the AI judge's
action = test and report


[test]
; A short label for this run. Results go in a folder called runs/<date-time>_<name>
; and the report is saved as reports/<name>.html
name = anythingllm_northwind
; Which file of test questions to use
cases = cases/northwind_rag.jsonl

; How many times to ask each question. 1 for a quick check, 3 for client work.
samples = 1

; How many questions to send at once. Use 2 (or 1) on a free-tier Gemini key.
workers = 2

; Which model acts as the AI judge. Blank = automatic:
; Claude if you have a Claude key, otherwise Gemini if you have a Gemini key,
; otherwise a basic offline stand-in (fine for the demo only).
judge_model =


[system under test]
; What you're testing. Choose one:
;   demo     the fake Northwind shop bot (no API key needed)
;   gemini   a system prompt running on a Gemini model (needs a Gemini key)
;   claude   a system prompt running on a Claude model (needs a Claude key)
;   or the name of your own adapter file in the adapters folder, without .py
type = gemini

; For gemini or claude: the model to test, and the system prompt file it runs on.
; Gemini examples: gemini-3.8-flash, gemini-3.6-flash, gemini-3.5-flash-lite, gemini-4-argon
; Claude example:  claude-sonnet-5-5
model = gemini-3.5-flash-lite
prompt_file = prompts/support_v1.txt

; Optional extras. Leave blank unless you need them (see README Part 4, step 4).
temperature =
max_tokens =
thinking_level =

; For the demo only: v1 (the original bot) or v2 (the "fixed" bot with a new bug)
demo_version = v1


[report]
title = Support assistant evaluation
client = Northwind Goods (demo)
author =

; Your written findings (a text file in the evalkit folder). Blank = none yet.
notes = 

; To compare with an earlier run, put that run's name here (e.g. demo_baseline).
; The report then shows what got fixed and what newly broke. Blank = no comparison.
compare_with =

; Open the report in your web browser when it's ready? yes or no
open_in_browser = yes


[marking sheet]
; Used by "export marking sheet" and "score marking sheet". Uses the latest run with the name above.
file = labels/sheet.csv

; How many samples of each question to include in the sheet (aim for 50-100 rows in total)
samples = 1


[window]
; Keep the window open at the end so you can read the results? yes or no
pause_at_end = yes
